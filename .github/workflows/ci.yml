name: CI
on:
  push: { branches: [main] }
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (lint, types, tests >=80% coverage, evals)
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: backend/pyproject.toml }
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: mypy app
      - run: python -m pytest   # fails under 80% coverage (pyproject: fail_under = 80)
      - run: python -m evals.run  # golden cases, citation coverage, hallucination gate

  backend-postgres:
    name: Backend on PostgreSQL + pgvector (migrations + tests)
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend } }
    services:
      db:
        image: pgvector/pgvector:pg16
        env: { POSTGRES_USER: rtn, POSTGRES_PASSWORD: rtn, POSTGRES_DB: rtn }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U rtn" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://rtn:rtn@localhost:5432/rtn
      TEST_DATABASE_URL: postgresql+asyncpg://rtn:rtn@localhost:5432/rtn_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: backend/pyproject.toml }
      - run: pip install -e ".[dev]"
      - name: Alembic upgrade / downgrade / upgrade
        run: |
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head
      - name: Create test database with pgvector
        run: |
          PGPASSWORD=rtn psql -h localhost -U rtn -d rtn -c "CREATE DATABASE rtn_test"
          PGPASSWORD=rtn psql -h localhost -U rtn -d rtn_test -c "CREATE EXTENSION IF NOT EXISTS vector"
      - run: python -m pytest --no-cov -q

  frontend:
    name: Frontend (eslint, tsc, vitest, build)
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  e2e:
    name: Playwright E2E (goal -> interview -> filled PDF -> review)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: backend/pyproject.toml }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: pip install -e backend
      - run: npm ci --no-audit --no-fund
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npx playwright test
        working-directory: frontend
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: playwright-report, path: frontend/playwright-report }

  security:
    name: Dependency scan + SAST
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }  # gitleaks scans the pushed commit range; a shallow clone lacks its start commit when several commits are pushed at once
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: pip-audit (Python dependencies)
        run: |
          pip install -e backend pip-audit bandit
          pip-audit --skip-editable
      - name: bandit (SAST)
        run: bandit -r backend/app -ll -q
      - name: npm audit (high+)
        working-directory: frontend
        run: npm audit --audit-level=high
      - name: Secret scan (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env: { GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }

  containers:
    name: Container build + scan
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with: { context: backend, load: true, tags: "rtn-api:ci", cache-from: type=gha, cache-to: "type=gha,mode=max" }
      - uses: docker/build-push-action@v6
        with: { context: frontend, load: true, tags: "rtn-web:ci", cache-from: type=gha, cache-to: "type=gha,mode=max" }
      - name: Trivy scan (HIGH/CRITICAL with a fix available fails the build)
        run: |
          for img in rtn-api:ci rtn-web:ci; do
            docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:0.58.1               image --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 --no-progress "$img"
          done
      - name: Verify containers run as non-root
        run: |
          test "$(docker run --rm --entrypoint id rtn-api:ci -u)" != "0"
          test "$(docker run --rm --entrypoint id rtn-web:ci -u)" != "0"

  compose-smoke:
    name: "make dev stack boots (compose) and the demo scenario runs"
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env
      - run: docker compose up -d --build --wait --wait-timeout 300
      - run: |
          pip install httpx
          python scripts/smoke_demo.py http://localhost:8000
          curl -fsS http://localhost:3000/en | grep -q "Red Tape Navigator"
          curl -fsS http://localhost:3000/bn | grep -q 'lang="bn"'
      - name: Worker is up (scheduled jobs)
        run: docker compose ps worker --format '{{.State}}' | grep -q running
      - if: failure()
        run: docker compose logs --no-color --tail=200
      - if: always()
        run: docker compose down -v
