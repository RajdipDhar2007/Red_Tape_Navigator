# Enable by (1) turning on Code scanning in the repo settings (free for public repos; private repos need GitHub
# Advanced Security) and (2) setting the repository variable ENABLE_CODEQL=true. Until then bandit + ruff security rules
# in ci.yml provide SAST.
name: CodeQL (SAST)
on:
  push: { branches: [main] }
  pull_request:
  schedule:
    - cron: "17 3 * * 1"
permissions:
  actions: read
  contents: read
  security-events: write
jobs:
  analyze:
    if: ${{ vars.ENABLE_CODEQL == 'true' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: { language: [python, javascript-typescript] }
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with: { languages: "${{ matrix.language }}" }
      - uses: github/codeql-action/analyze@v3
