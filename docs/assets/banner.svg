<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="1200" height="360" role="img" aria-labelledby="t d">
  <title id="t">Red Tape Navigator</title>
  <desc id="d">A red ribbon of red tape being cut by scissors, above the title Red Tape Navigator and the tagline: tell us your goal, we cut through the red tape.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1F4F"/>
      <stop offset="1" stop-color="#071433"/>
    </linearGradient>
    <linearGradient id="tri" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FF9933"/>
      <stop offset="0.5" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#138808"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#FFFFFF" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1200" height="360" rx="18" fill="url(#bg)"/>
  <rect width="1200" height="360" rx="18" fill="url(#grid)"/>
  <rect x="0" y="0" width="1200" height="8" rx="4" fill="url(#tri)"/>

  <!-- the red tape, tangled on the left, cut cleanly on the right -->
  <path d="M40 92 C 120 40, 200 150, 290 92 S 430 60, 500 96" fill="none" stroke="#C81E1E" stroke-width="16" stroke-linecap="round"/>
  <path d="M40 92 C 120 40, 200 150, 290 92 S 430 60, 500 96" fill="none" stroke="#FF5A5A" stroke-opacity="0.45" stroke-width="3" stroke-dasharray="2 12" stroke-linecap="round"/>
  <path d="M620 96 L 1160 96" fill="none" stroke="#C81E1E" stroke-width="16" stroke-linecap="round"/>
  <path d="M620 96 L 1160 96" fill="none" stroke="#FF5A5A" stroke-opacity="0.45" stroke-width="3" stroke-dasharray="2 12" stroke-linecap="round"/>

  <!-- scissors in the gap -->
  <g transform="translate(560 96)" stroke="#FF9933" stroke-width="5" stroke-linecap="round" fill="none">
    <line x1="-38" y1="-22" x2="30" y2="14"/>
    <line x1="-38" y1="22" x2="30" y2="-14"/>
    <circle cx="-44" cy="-26" r="9" fill="#0B1F4F"/>
    <circle cx="-44" cy="26" r="9" fill="#0B1F4F"/>
  </g>
  <g fill="#FFFFFF" opacity="0.9">
    <circle cx="520" cy="60" r="3"/><circle cx="600" cy="140" r="2.5"/><circle cx="580" cy="48" r="2"/>
  </g>

  <text x="600" y="196" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="68" font-weight="800" fill="#FFFFFF" letter-spacing="1">Red Tape Navigator</text>
  <text x="600" y="240" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="26" fill="#FF9933" font-weight="600">Tell us your goal. We cut through the red tape.</text>

  <g font-family="Consolas, Menlo, monospace" font-size="18" fill="#BFD0FF" text-anchor="middle">
    <text x="600" y="296">GOAL  ›  PLAN  ›  RESEARCH  ›  INTERVIEW  ›  FILL  ›  REVIEW  ›  YOU SIGN</text>
  </g>
  <rect x="380" y="316" width="440" height="4" rx="2" fill="url(#tri)" opacity="0.9"/>
</svg>
