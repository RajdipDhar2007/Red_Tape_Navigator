<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 48" width="1200" height="48" role="img" aria-label="A red ribbon cut by golden scissors">
  <defs>
    <linearGradient id="satin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FF5A4F"/>
      <stop offset="0.45" stop-color="#D4161C"/>
      <stop offset="1" stop-color="#8E0B12"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FBE38A"/>
      <stop offset="0.5" stop-color="#D9A322"/>
      <stop offset="1" stop-color="#9A6B0A"/>
    </linearGradient>
    <path id="ribbon" d="M28 15 C 140 7, 240 27, 380 19 S 500 14, 552 21 L 545 27 L 553 33 C 500 38, 430 42, 380 35 S 140 23, 28 29 L 42 22 Z"/>
  </defs>

  <!-- left ribbon -->
  <use href="#ribbon" fill="url(#satin)"/>
  <path d="M42 22 C 150 15, 250 33, 380 27 S 500 24, 548 27" fill="none" stroke="#FFB3A8" stroke-opacity="0.35" stroke-width="1.5"/>

  <!-- right ribbon (mirror) -->
  <g transform="translate(1200 0) scale(-1 1)">
    <use href="#ribbon" fill="url(#satin)"/>
    <path d="M42 22 C 150 15, 250 33, 380 27 S 500 24, 548 27" fill="none" stroke="#FFB3A8" stroke-opacity="0.35" stroke-width="1.5"/>
  </g>

  <!-- golden scissors -->
  <g stroke-linecap="round" stroke-linejoin="round">
    <path d="M600 24 L 588 2 L 595 3 Z" fill="url(#gold)" stroke="#8A5E08" stroke-width="0.8"/>
    <path d="M600 24 L 613 3 L 606 2 Z" fill="url(#gold)" stroke="#8A5E08" stroke-width="0.8"/>
    <path d="M600 24 L 593 36" fill="none" stroke="url(#gold)" stroke-width="3"/>
    <path d="M600 24 L 608 36" fill="none" stroke="url(#gold)" stroke-width="3"/>
    <ellipse cx="591" cy="39" rx="5.2" ry="7" transform="rotate(14 591 39)" fill="none" stroke="url(#gold)" stroke-width="2.6"/>
    <ellipse cx="610" cy="39" rx="5.2" ry="7" transform="rotate(-14 610 39)" fill="none" stroke="url(#gold)" stroke-width="2.6"/>
    <circle cx="600" cy="24" r="2.2" fill="#FBE38A" stroke="#8A5E08" stroke-width="0.8"/>
    <!-- cut sparks -->
    <path d="M572 12 L 578 17 M 568 22 L 576 23 M 628 12 L 622 17 M 632 22 L 624 23" fill="none" stroke="#F2C94C" stroke-width="1.6"/>
  </g>
</svg>
