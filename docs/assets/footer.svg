<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 160" width="1200" height="160" role="img" aria-labelledby="t">
  <title id="t">Built so that the next person who wants to open a bakery spends their time baking.</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1F4F"/>
      <stop offset="1" stop-color="#071433"/>
    </linearGradient>
    <linearGradient id="tri" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FF9933"/>
      <stop offset="0.5" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#138808"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="160" rx="18" fill="url(#bg)"/>
  <rect x="0" y="152" width="1200" height="8" rx="4" fill="url(#tri)"/>
  <text x="600" y="62" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="30" font-weight="700" fill="#FFFFFF">Less paperwork. More baking.</text>
  <text x="600" y="98" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="19" fill="#FF9933">Built so the next person who wants to open a bakery spends their time baking.</text>
  <text x="600" y="130" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="15" fill="#BFD0FF">Team Onyx  ·  HACK&lt;N&gt;PITCH  ·  Jadavpur University</text>
</svg>
