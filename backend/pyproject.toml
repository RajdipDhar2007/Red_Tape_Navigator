[project]
name = "red-tape-navigator"
version = "0.1.0"
description = "Agentic assistant for navigating Indian government bureaucracy"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic[email]>=2.8",
  "pydantic-settings>=2.4",
  "sqlalchemy[asyncio]>=2.0.30",
  "aiosqlite>=0.20",
  "asyncpg>=0.29",
  "alembic>=1.13",
  "redis>=5.0",
  "arq>=0.26",
  "anthropic>=0.40",
  "httpx>=0.27",
  "trafilatura>=1.12",
  "playwright>=1.46",
  "pyyaml>=6.0",
  "pypdf>=4.3",
  "pymupdf>=1.24",
  "reportlab>=4.2",
  "cryptography>=43",
  "pyjwt>=2.9",
  "passlib[bcrypt]>=1.7.4",
  "bcrypt>=4.0,<5.1",
  "python-multipart>=0.0.9",
  "prometheus-client>=0.20",
  "opentelemetry-api>=1.26",
  "opentelemetry-sdk>=1.26",
  "structlog>=24.4",
  "pgvector>=0.3",
  "opentelemetry-exporter-otlp-proto-http>=1.26",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3", "pytest-asyncio>=0.24", "pytest-cov>=5.0", "respx>=0.21",
  "ruff>=0.6", "mypy>=1.11", "pip-audit>=2.7", "bandit>=1.7", "types-PyYAML", "locust>=2.31",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--cov=app --cov-report=term-missing"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.coverage.run]
omit = ["app/integrations/real/*", "app/jobs/worker.py"]
concurrency = ["greenlet", "thread"]

[tool.coverage.report]
fail_under = 80

[tool.ruff]
line-length = 130
target-version = "py312"
[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101", "B008", "E501", "UP047"]
[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "E501", "B", "UP"]
"evals/*" = ["S"]
"app/kb/catalog.py" = ["E501"]
"app/interview/fields.py" = ["E501"]
"app/interview/validators.py" = ["E501"]
"app/api/*" = ["E501"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = true
