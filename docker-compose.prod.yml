# Production stack: TLS reverse proxy, no demo mode, no published DB/Redis ports, restart policies.
#
#   cp .env.prod.example .env.prod      # fill in every value (see docs/DEPLOYMENT.md)
#   docker compose --env-file .env.prod -f docker-compose.prod.yml up -d --build
#   ADMIN_PASSWORD='...' docker compose --env-file .env.prod -f docker-compose.prod.yml \
#       exec -e PYTHONPATH=/app -e ADMIN_PASSWORD api python /app/scripts/create_admin.py officer@dept.gov.in admin
#
# The API refuses to start if the configuration is unsafe (see backend/app/core/config.py).
x-restart: &restart
  restart: unless-stopped

services:
  db:
    <<: *restart
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: rtn
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: rtn
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U rtn"], interval: 5s, timeout: 3s, retries: 10 }

  redis:
    <<: *restart
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes: [redisdata:/data]
    healthcheck: { test: ["CMD", "redis-cli", "ping"], interval: 5s, timeout: 3s, retries: 10 }

  api:
    <<: *restart
    build: ./backend
    environment: &api-env
      APP_ENV: prod
      DEMO_MODE: "false"
      SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY}
      FIELD_ENCRYPTION_KEY: ${FIELD_ENCRYPTION_KEY:?set FIELD_ENCRYPTION_KEY}
      DATABASE_URL: postgresql+asyncpg://rtn:${POSTGRES_PASSWORD}@db:5432/rtn
      REDIS_URL: redis://redis:6379/0
      CORS_ORIGINS: https://${WEB_DOMAIN:?set WEB_DOMAIN}
      TRUST_PROXY: "true"
      WEB_BASE_URL: https://${WEB_DOMAIN}
      SMTP_HOST: ${SMTP_HOST:?set SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:?set SMTP_FROM}
      SMTP_STARTTLS: ${SMTP_STARTTLS:-true}
      METRICS_TOKEN: ${METRICS_TOKEN:-}
      GRIEVANCE_CONTACT: ${GRIEVANCE_CONTACT:?set GRIEVANCE_CONTACT}
      LLM_PROVIDER: ${LLM_PROVIDER:-auto}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-}
      SENTRY_DSN: ${SENTRY_DSN:-}
      RETENTION_DAYS: ${RETENTION_DAYS:-90}
      DATA_REGION: ${DATA_REGION:-in-mumbai}
      MSG91_AUTHKEY: ${MSG91_AUTHKEY:-}
      MSG91_TEMPLATE_ID: ${MSG91_TEMPLATE_ID:-}
      MSG91_TEXT_VAR: ${MSG91_TEXT_VAR:-var1}
      DIGIO_CLIENT_ID: ${DIGIO_CLIENT_ID:-}
      DIGIO_CLIENT_SECRET: ${DIGIO_CLIENT_SECRET:-}
      DIGIO_ENV: ${DIGIO_ENV:-sandbox}
      DIGIO_WEBHOOK_SECRET: ${DIGIO_WEBHOOK_SECRET:-}
      DIGIO_WEBHOOK_IPS: ${DIGIO_WEBHOOK_IPS:-}
      DIGIO_DIGILOCKER_TEMPLATE: ${DIGIO_DIGILOCKER_TEMPLATE:-DIGILOCKER_AADHAAR_PAN}
      STORAGE_BACKEND: ${STORAGE_BACKEND:-local}
      STORAGE_LOCAL_DIR: ${STORAGE_LOCAL_DIR:-/var/lib/rtn/vault}
      STORAGE_BUCKET: ${STORAGE_BUCKET:-}
      STORAGE_REGION: ${STORAGE_REGION:-auto}
      STORAGE_ENDPOINT_URL: ${STORAGE_ENDPOINT_URL:-}
      STORAGE_ACCESS_KEY_ID: ${STORAGE_ACCESS_KEY_ID:-}
      STORAGE_SECRET_ACCESS_KEY: ${STORAGE_SECRET_ACCESS_KEY:-}
      MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-5242880}
      DOCUMENT_SCAN_MODE: ${DOCUMENT_SCAN_MODE:-disabled}
      DOCUMENT_SCAN_URL: ${DOCUMENT_SCAN_URL:-}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
    volumes:
      - ./scripts:/scripts:ro
      - vaultdata:/var/lib/rtn/vault
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=2).status==200 else 1)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    depends_on: { db: { condition: service_healthy }, redis: { condition: service_healthy } }

  worker:
    <<: *restart
    build: ./backend
    command: ["arq", "app.jobs.worker.WorkerSettings"]
    environment:
      <<: *api-env
      RUN_MIGRATIONS: "false"
      SEED_ON_START: "false"
    volumes:
      - ./scripts:/scripts:ro
      - vaultdata:/var/lib/rtn/vault
    healthcheck:
      test: ["CMD", "arq", "--check", "app.jobs.worker.WorkerSettings"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 45s
    depends_on: { api: { condition: service_healthy } }

  web:
    <<: *restart
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: https://${API_DOMAIN:?set API_DOMAIN}
        NEXT_PUBLIC_DEMO_MODE: "false"
    depends_on: { api: { condition: service_healthy } }

  proxy:
    <<: *restart
    image: caddy:2-alpine
    ports: ["80:80", "443:443"]
    environment:
      WEB_DOMAIN: ${WEB_DOMAIN}
      API_DOMAIN: ${API_DOMAIN}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [api, web]

volumes:
  pgdata:
  redisdata:
  vaultdata:
  caddy_data:
  caddy_config:
