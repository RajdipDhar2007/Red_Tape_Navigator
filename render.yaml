# Render Blueprint: ZERO-COST TRIAL of the backend (one API service + PostgreSQL). No card is needed.
# The web frontend is deployed separately on Vercel. Full steps: docs/DEPLOY_NOW.md
#
# What "free" means on Render (https://render.com/docs/free), so nobody is surprised:
#   * the API sleeps after 15 minutes without traffic and takes about a minute to wake (an uptime monitor on /ready keeps it awake);
#   * the free PostgreSQL database EXPIRES 30 DAYS after creation: upgrade it to `0.1c-256mb` (or move to
#     render.production.yaml) before then, or the data is lost;
#   * no shell, no backups, and outbound SMTP ports 25/465/587 are blocked (use port 2525, set below).
# For a real launch use render.production.yaml (paid: separate worker, Redis, backups).
#
# Render has no India region; Singapore is the closest. DATA_REGION below keeps the privacy notice truthful.
# Values marked sync:false are typed once into the Render dashboard when the Blueprint is created. They are never committed.

databases:
  - name: rtn-db
    region: singapore
    plan: free
    postgresMajorVersion: "16"   # same major version as CI; the migrations run CREATE EXTENSION vector (pgvector)
    databaseName: rtn
    user: rtn

services:
  - type: web
    name: rtn-api
    runtime: docker
    region: singapore
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /health
    autoDeployTrigger: checksPass   # a push to main deploys only after the CI checks pass
    envVars:
      - { key: PORT, value: "8000" }   # the port the container listens on (Render routes traffic to it)
      - { key: APP_ENV, value: prod }
      - { key: DEMO_MODE, value: "false" }
      - { key: TRUST_PROXY, value: "true" }
      - { key: DATA_REGION, value: ap-singapore }
      - { key: RETENTION_DAYS, value: "90" }
      - { key: RUN_SCHEDULER, value: "true" }   # reminders, retention purge and weekly re-checks run inside this one instance
      - { key: LLM_PROVIDER, value: none }      # rules-first mode; set GEMINI_API_KEY + GEMINI_MODEL and "auto" later if wanted
      - { key: DATABASE_URL, fromDatabase: { name: rtn-db, property: connectionString } }
      - { key: SECRET_KEY, generateValue: true }
      # Generated once by Render. COPY IT from the dashboard into a password manager: losing it makes stored Aadhaar/PAN answers unreadable.
      - { key: FIELD_ENCRYPTION_KEY, generateValue: true }
      - { key: METRICS_TOKEN, generateValue: true }
      - { key: CORS_ORIGINS, sync: false }       # https://<your-vercel-domain>   (no trailing slash)
      - { key: WEB_BASE_URL, sync: false }       # the same https://<your-vercel-domain>
      - { key: GRIEVANCE_CONTACT, sync: false }  # email of the data-protection grievance officer shown to citizens
      - { key: SMTP_HOST, sync: false }          # e.g. smtp-relay.brevo.com
      - { key: SMTP_PORT, value: "2525" }        # 587 is blocked on free instances; Brevo, SendGrid and Mailgun all accept 2525
      - { key: SMTP_USERNAME, sync: false }
      - { key: SMTP_PASSWORD, sync: false }
      - { key: SMTP_FROM, sync: false }          # a sender address verified with the SMTP provider
      # First officer account (free instances have no shell). Sign in once, change the password in the app, then delete both.
      - { key: BOOTSTRAP_ADMIN_EMAIL, sync: false }
      - { key: BOOTSTRAP_ADMIN_PASSWORD, sync: false }   # 12 characters or more
      # Document Vault. Free instances have an ephemeral disk, so uploads vanish on redeploy: set STORAGE_BACKEND=s3 (S3/R2) before relying on it.
      - { key: STORAGE_BACKEND, value: local }
      - { key: STORAGE_LOCAL_DIR, value: /app/data/vault }
      - { key: MAX_UPLOAD_BYTES, value: "5242880" }
      - { key: DOCUMENT_SCAN_MODE, value: disabled }
